[workspace]
members = ["tests/recovery-host", "crates/rom-openrouter", "crates/rom-ai", "crates/rom-fields", "crates/rom-conformance", "crates/rom-cli", "demo", "crates/rom-backup", "crates/rom-blob", "crates/rom-blob-object-store", "crates/rom-config", "crates/rom-http", "crates/rom-studio-host", "crates/rom-identity", "crates/rom-auth", "crates/rom", "crates/rom-derive", "crates/rom-sqlite", "crates/rom-redb", "examples/consumer", "tests/persistence", "tools/query-measure"]
exclude = ["tests/compile"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/pmikstacki/ROM"
publish = false
[workspace.dependencies]
rom-fields = { version = "=0.1.0", path = "crates/rom-fields" }
rom-conformance = { version = "=0.1.0", path = "crates/rom-conformance" }
rom = { version = "=0.1.0", path = "crates/rom" }
rom-derive = { version = "=0.1.0", path = "crates/rom-derive" }
rom-sqlite = { version = "=0.1.0", path = "crates/rom-sqlite" }
rom-redb = { version = "=0.1.0", path = "crates/rom-redb" }
redb = "=4.3.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
syn = "=3.0.6"
quote = "=1.0.47"
proc-macro2 = "=1.0.107"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
