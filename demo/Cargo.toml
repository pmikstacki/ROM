[package]
name = "rom-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Runnable ROM Resource author walkthrough with local synthetic data"
[lints]
workspace = true
[features]
default = []
studio = ["dep:rom-studio-host"]
provider-profile = ["dep:rom-auth", "dep:libc"]
[dependencies]
rom.workspace = true
rom-sqlite.workspace = true
rom-redb.workspace = true
rom-http = { path = "../crates/rom-http", version = "=0.1.0-alpha.1" }
rom-config = { path = "../crates/rom-config", version = "=0.1.0-alpha.1" }
rom-identity = { path = "../crates/rom-identity", version = "=0.1.0-alpha.1" }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "signal"] }
rom-blob = { path = "../crates/rom-blob", version = "=0.1.0-alpha.1" }
rom-blob-object-store = { path = "../crates/rom-blob-object-store", version = "=0.1.0-alpha.1" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

rom-backup = { path = "../crates/rom-backup", version = "=0.1.0-alpha.1" }
rom-auth = { path = "../crates/rom-auth", version = "=0.1.0-alpha.1", optional = true, features = ["introspection"] }
libc = { version = "=0.2.189", optional = true }

rom-studio-host = { path = "../crates/rom-studio-host", version = "=0.1.0-alpha.1", optional = true }
