[workspace]
members = ["core", "sqlite"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.0.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
