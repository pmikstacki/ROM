[workspace]
members = ["core", "adapters"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
futures-core = "0.3.32"
futures-util = "0.3.32"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
