[package]
name = "resource-flow-prototype"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
publish = false

[dependencies]
axum = "=0.7.9"
tokio = { version = "=1.41.1", features = ["full"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
async-stream = "=0.3.6"
futures-core = "=0.3.31"
# Resolver compatibility pins for the existing Rust/Cargo 1.82 probe container.
hyper = "=1.5.1"
hyper-util = "=0.1.10"
log = "=0.4.22"
cc = "=1.2.5"
