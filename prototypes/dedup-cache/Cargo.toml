[package]
name = "rom-dedup-cache-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
moka = { version = "=0.12.16", features = ["sync"] }
quick_cache = "=0.7.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
