[package]
name = "authoring-builders"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["bon", "typed", "manual"]
bon = ["dep:bon"]
typed = ["dep:typed-builder"]
manual = []

[dependencies]
bon = { version = "=3.10.1", optional = true }
typed-builder = { version = "=0.23.2", optional = true }

[workspace]
exclude = ["fixtures"]
