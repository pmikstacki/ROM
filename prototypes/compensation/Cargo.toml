[package]
name = "rom-compensation-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
[workspace]
[dependencies]
rom = { path = "../../crates/rom" }
rom-sqlite = { path = "../../crates/rom-sqlite", features = ["test-support"] }
rom-redb = { path = "../../crates/rom-redb" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
[profile.dev]
debug = 0
[profile.test]
debug = 0
