[package]
name = "rom-auth-probe-adapters"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rom-auth-probe-core = { path = "../core" }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
