[package]
name = "rom-transport-trials"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
rayon = "=1.12.0"
tower = { version = "=0.5.3", features = ["util", "limit", "timeout", "buffer", "load-shed"] }
