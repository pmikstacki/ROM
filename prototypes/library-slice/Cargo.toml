[package]
name = "rom-library-slice"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
