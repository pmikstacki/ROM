[package]
name = "rom-query-planning-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
build = "build.rs"
[workspace]
[features]
default = ["generated", "hybrid", "runtime"]
generated = []
hybrid = []
runtime = []
[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
redb = "=4.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
[profile.dev]
debug = 0
[profile.test]
debug = 0
