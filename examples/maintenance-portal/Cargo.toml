[package]
name = "rom-maintenance-portal"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

[features]
http-fixture = []

[[bin]]
name = "rom-maintenance-http-fixture"
path = "fixtures/http/main.rs"
required-features = ["http-fixture"]

[dependencies]
rom = { version = "=0.1.0", path = "../../crates/rom" }
rom-fields = { version = "=0.1.0", path = "../../crates/rom-fields" }
rom-sqlite = { version = "=0.1.0", path = "../../crates/rom-sqlite", features = ["test-support"] }
rom-redb = { version = "=0.1.0", path = "../../crates/rom-redb", features = ["test-support"] }
rom-http = { version = "=0.1.0", path = "../../crates/rom-http" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
