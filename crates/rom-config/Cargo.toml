[package]
name = "rom-config"
description = "Bounded configuration ingestion into existing ROM Resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
[lints]
workspace = true
[features]
default = []
[dependencies]
rom.workspace = true
config = { version = "=0.15.27", default-features = false, features = ["json", "toml"] }
serde.workspace = true
serde_json.workspace = true
[dev-dependencies]
rom-identity = { version = "=0.1.0-alpha.1", path = "../rom-identity" }
rom-sqlite = { workspace = true, features = ["test-support"] }
rom-redb = { workspace = true, features = ["test-support"] }
tokio.workspace = true
