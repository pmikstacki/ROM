[package]
name = "rom-openrouter"
description = "Optional bounded OpenRouter HTTP adapter for ROM AI flows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
rom-ai = { version = "=0.1.0", path = "../rom-ai" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
httpdate = "=1.0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rom = { version = "=0.1.0", path = "../rom" }
rom-sqlite = { version = "=0.1.0", path = "../rom-sqlite", features = ["test-support"] }
rom-redb = { version = "=0.1.0", path = "../rom-redb", features = ["test-support"] }

[[test]]
name = "loopback"
required-features = ["test-support"]
