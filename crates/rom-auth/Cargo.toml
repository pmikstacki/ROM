[package]
name = "rom-auth"
description = "Optional bounded credential verification adapters for ROM hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
[lints]
workspace = true
[features]
default = []
jwt = ["dep:jsonwebtoken", "dep:serde", "dep:serde_json"]
oidc = ["jwt", "dep:sha2", "dep:base64", "dep:subtle"]
introspection = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:sha2", "dep:form_urlencoded"]
[dependencies]
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"], optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "form", "rustls"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "=0.10.9", optional = true }
form_urlencoded = { version = "=1.2.2", optional = true }
base64 = { version = "=0.22.1", optional = true }
subtle = { version = "=2.6.1", optional = true }
