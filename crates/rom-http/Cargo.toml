[package]
name = "rom-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic HTTP binding for ROM semantic contracts"
[lints]
workspace = true
[dependencies]
rom = { workspace = true, default-features = false }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
[dev-dependencies]
rom-consumer = { path = "../../examples/consumer" }
rom-sqlite = { workspace = true, features = ["test-support"] }
