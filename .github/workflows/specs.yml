name: Specification validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate specifications
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npm exec --yes --package=@fission-ai/openspec@1.14.0 -- openspec validate --all --strict
