[package]
name = "rom-recovery-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rom.workspace = true
rom-sqlite = { workspace = true, features = ["test-support"] }
rom-redb = { workspace = true, features = ["test-support"] }
rom-http = { version = "=0.1.0", path = "../../crates/rom-http" }
rom-backup = { version = "=0.1.0", path = "../../crates/rom-backup" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
