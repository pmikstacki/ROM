[package]
name = "rom-ai-progress-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

[dependencies]
rom = { version = "=0.0.3", path = "../../../../crates/rom" }
rom-ai = { version = "=0.0.3", path = "../../../../crates/rom-ai" }
rom-sqlite = { version = "=0.0.3", path = "../../../../crates/rom-sqlite" }
rom-redb = { version = "=0.0.3", path = "../../../../crates/rom-redb" }
rom-ai-flows-consumer = { path = "../../../../examples/ai-flows" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
